# Local SSH test targets for the integration tests (pytest -m integration). Both containers
# listen on localhost only. The key pair in .keys/ is generated by up.sh and never committed.
name: ec2patcher-test-targets

services:
  ubuntu:
    build:
      context: .
      dockerfile: ubuntu.Dockerfile
    image: ec2patcher-test-target-ubuntu:24.04
    hostname: ec2p-test-ubuntu
    ports:
      - "127.0.0.1:${EC2P_IT_UBUNTU_PORT:-2201}:22"
    volumes:
      - ./.keys/id_ed25519.pub:/keys/authorized_keys:ro

  amazonlinux:
    build:
      context: .
      dockerfile: amazonlinux.Dockerfile
    image: ec2patcher-test-target-amazonlinux:2023
    hostname: ec2p-test-amazonlinux
    ports:
      - "127.0.0.1:${EC2P_IT_AMAZON_PORT:-2202}:22"
    volumes:
      - ./.keys/id_ed25519.pub:/keys/authorized_keys:ro

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ec2patcher"
# Single source of truth for the version; ec2patcher.__version__ reads the installed metadata.
version = "1.0.0"
description = "Local web GUI that analyzes Ubuntu and Amazon Linux 2023 EC2 servers for CVE fixes and patches Ubuntu servers over SSH from an approved .deb plan"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amir Amiri" }]
requires-python = ">=3.10"
keywords = ["ec2", "aws", "ubuntu", "amazon-linux", "cve", "security", "patching", "ssh", "apt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "platformdirs>=4.0",
    "openpyxl>=3.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/Amiri83/EC2Patcher"
Source = "https://github.com/Amiri83/EC2Patcher"
Issues = "https://github.com/Amiri83/EC2Patcher/issues"

[project.scripts]
ec2patcher = "ec2patcher.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ec2patcher = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need the local SSH test targets (scripts/test-targets); they are
# deselected by default and run with: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: needs the local SSH test target containers (scripts/test-targets/up.sh)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

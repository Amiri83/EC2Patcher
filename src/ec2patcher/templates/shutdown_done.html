<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EC2 Patcher stopped</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f5f7;
           color: #1f2933; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { background: #fff; border: 1px solid #d9dde3; border-radius: 8px; padding: 32px 40px; max-width: 480px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { margin: 0 0 8px; color: #52606d; }
    code { background: #f0f2f5; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>EC2 Patcher has been shut down</h1>
    <p>All data has been saved. You can close this tab.</p>
    <p>To start again, run <code>ec2patcher</code>.</p>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EC2 Patcher stopped</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Inline on purpose: the server is already stopped, so /static is no longer served.
     The values are the DadsOps theme's tokens (static/theme/dadsops-theme.css); dark only. #}
  <style>
    :root { color-scheme: dark; --bg: #0d1117; --bg-panel: #161b22; --bg-subtle: #1c2129;
            --fg: #f0f4f8; --fg-faint: #aab4be; --border: #3d444d; --ok: #56d364; }
    body { font: 15px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--fg); display: flex; align-items: center;
           justify-content: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
    .box { background: var(--bg-panel); border: 1px solid var(--border); border-top: 4px solid var(--ok);
           border-radius: 10px; padding: 32px 40px; max-width: 480px;
           box-shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 8px 20px rgba(0, 0, 0, .4); }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { margin: 0 0 8px; color: var(--fg-faint); }
    code { background: var(--bg-subtle); border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px;
           font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="box">
    <h1>EC2 Patcher has been shut down</h1>
    <p>All data has been saved. You can close this tab.</p>
    <p>To start again, run <code>ec2patcher</code>.</p>
  </div>
</body>
</html>

{% if r.status == "running" %}<span class="badge badge-warning">RUNNING</span>
{%- elif r.status == "completed" %}<span class="badge badge-success">COMPLETED</span>
{%- elif r.status == "completed_with_errors" %}<span class="badge badge-warning">COMPLETED WITH ERRORS</span>
{%- elif r.status == "interrupted" %}<span class="badge badge-danger">INTERRUPTED</span>
{%- else %}<span class="badge badge-danger">FAILED</span>{% endif %}
